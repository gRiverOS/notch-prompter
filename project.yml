name: NotchPrompter
options:
  bundleIdPrefix: cl.gustavo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NotchPrompter:
    type: application
    platform: macOS
    sources:
      - NotchPrompter
    info:
      path: NotchPrompter/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NotchPrompter
        CFBundleDisplayName: NotchPrompter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Gustavo L. Riveros. MIT License."
    settings:
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: NO
  NotchPrompterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NotchPrompterTests
    dependencies:
      - target: NotchPrompter
schemes:
  NotchPrompter:
    build:
      targets:
        NotchPrompter: all
        NotchPrompterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchPrompterTests
